name: Compilar APK y AAB de PiqueUY para Android y Play Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código Python de PiqueUY
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación Android (SDL2 / NDK / Java 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Compilar archivo .APK instalable con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer_apk
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir el archivo .APK listo para descargar al celular
        uses: actions/upload-artifact@v4
        with:
          name: PiqueUY-Android-APK
          path: ${{ steps.buildozer_apk.outputs.filename }}
